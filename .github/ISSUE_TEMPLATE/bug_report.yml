name: Bug report
description: Something in Diby is not working the way it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please check that it has not already been reported.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `diby_delegate` with ...
        2. Open the panel and ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - OpenAI Codex CLI
        - GitHub Copilot agent mode
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language adapter
      options:
        - python
        - generic
        - Other / not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Diby, VS Code, Node, and OS.
      placeholder: "Diby 0.0.1, VS Code 1.101, Node 22.x, macOS 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Output from the Diby output channel, or test output. Remove anything private.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I am using the latest release or `main`.
          required: true
