name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build before testing so test/e2e/bridge-shim.test.ts exercises the real dist/mcp-shim.js.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Build against the version pinned in .nvmrc, which is what contributors use.
  nvmrc:
    name: Node (.nvmrc) on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Build before testing so test/e2e/bridge-shim.test.ts exercises the real dist/mcp-shim.js.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
