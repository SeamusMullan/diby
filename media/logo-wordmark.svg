    </g>
  </g>
  <text x="148" y="74" class="wordmark" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-1">Diby</text>
  <text x="151" y="104" class="tagline" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.5">do it by yourself</text>
