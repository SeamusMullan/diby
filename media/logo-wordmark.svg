    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #F9FAFB; }
      .tagline  { fill: #9CA3AF; }
    }
  </style>
  <!-- Icon (same artwork as media/icon.svg), placed at 128x128 -->
